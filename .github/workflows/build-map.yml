name: Build OSRM Map Data
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Osmium Tool
        run: |
          sudo apt-get update -y
          sudo apt-get install -y osmium-tool zip

      - name: Download Raw Java OSM Data
        run: curl -L -o raw-java.osm.pbf https://download.geofabrik.de/asia/indonesia/java-latest.osm.pbf

      - name: Crop Map to Banten, Jakarta, and West Java
        # This shrinks the file so GitHub Actions won't run out of memory!
        run: osmium extract -b 105.0,-8.0,109.0,-5.5 raw-java.osm.pbf -o java-latest.osm.pbf

      - name: Extract Map
        run: docker run -v ${{ github.workspace }}:/data ghcr.io/project-osrm/osrm-backend osrm-extract -p /opt/car.lua /data/java-latest.osm.pbf

      - name: Partition Map
        run: docker run -v ${{ github.workspace }}:/data ghcr.io/project-osrm/osrm-backend osrm-partition /data/java-latest.osrm

      - name: Customize Map
        run: docker run -v ${{ github.workspace }}:/data ghcr.io/project-osrm/osrm-backend osrm-customize /data/java-latest.osrm

      - name: Zip the Processed Data
        run: zip java-osrm-data.zip java-latest.osrm java-latest.osrm.*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0-maps
          name: "OSRM Map Data (Java)"
          files: java-osrm-data.zip
