name: Sync Fulfillment & Frex Data

on:
  workflow_dispatch: {}   # manual trigger from the Actions tab, or via the dashboard's Fetch data button
  schedule:
    - cron: '0 10 * * *'    # 17:00 WIB (UTC+7) - runs in UTC, see note below
    - cron: '0 11 * * *'    # 18:00 WIB (UTC+7)
    - cron: '0 13 * * *'    # 20:00 WIB (UTC+7)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          TMS_EMAIL: ${{ secrets.TMS_EMAIL }}
          TMS_PASSWORD: ${{ secrets.TMS_PASSWORD }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python pipeline.py

  keepalive:
    # Scheduled workflows get auto-disabled by GitHub after 60 days with no
    # commit to the repo (this pipeline only writes to Google Sheets, never
    # to git, so that clock would otherwise just keep ticking silently).
    # Re-enabling via the API on every scheduled run - twice a day - resets
    # that clock without needing a dummy commit or a third-party action.
    # Runs even if the sync job above fails, so a broken pipeline doesn't
    # also cost you the schedule itself.
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow (resets the 60-day inactivity clock)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/sync-data.yml/enable"
