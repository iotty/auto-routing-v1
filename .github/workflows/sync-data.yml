name: Sync Fulfillment & Frex Data

on:
  workflow_dispatch: {}   # manual trigger from the Actions tab, or via the dashboard's Fetch data button
  schedule:
    - cron: '30 10 * * *'   # 17:30 WIB (UTC+7) - runs in UTC, see note below
    - cron: '0 13 * * *'    # 20:00 WIB (UTC+7)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          TMS_EMAIL: ${{ secrets.TMS_EMAIL }}
          TMS_PASSWORD: ${{ secrets.TMS_PASSWORD }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python pipeline.py
