name: Run Routing

on:
  workflow_dispatch:
    inputs:
      route_date:
        description: 'Route Date (YYYY-MM-DD)'
        required: false
      vehicle_capacity:
        description: 'Max Box Capacity'
        required: false
      shift_length:
        description: 'Shift Length (Minutes)'
        required: false
      service_time:
        description: 'Base Service Time (Minutes)'
        required: false
      depot_lat:
        description: 'Depot Latitude'
        required: false
      depot_lng:
        description: 'Depot Longitude'
        required: false
      service_free_box_threshold:
        description: 'Free service time up to (boxes)'
        required: false
      service_per_extra_box_minutes:
        description: 'Extra service minutes per box beyond the threshold'
        required: false
      traffic_multiplier:
        description: 'Traffic time multiplier (1.5 = assume 50% slower than free-flow)'
        required: false
      break_minutes:
        description: 'Break minutes (lunch/prayer), deducted from the raw shift length'
        required: false
      depot_prep_minutes:
        description: 'Depot prep minutes (loading, manifest check), deducted from the raw shift length'
        required: false

jobs:
  run-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and Unzip Map Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p map_data
          # Downloads the zip securely from the GitHub release you just created
          gh release download v1.0-maps -p "java-osrm-data.zip"
          unzip java-osrm-data.zip -d map_data/

      - name: Start Local OSRM Server
        run: |
          docker run -d --name osrm -p 5000:5000 \
            -v ${{ github.workspace }}/map_data:/data \
            ghcr.io/project-osrm/osrm-backend \
            osrm-routed --algorithm mld /data/java-latest.osrm
          
          echo "Waiting for OSRM server to boot up..."
          until curl -s "http://localhost:5000/table/v1/driving/106.53,-6.23;106.60,-6.20" > /dev/null; do
            sleep 2
          done
          echo "OSRM Server is ready!"

      - name: Run Routing Solver
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ROUTE_DATE: ${{ github.event.inputs.route_date }}
          VEHICLE_CAPACITY_BOX: ${{ github.event.inputs.vehicle_capacity }}
          SHIFT_LENGTH_MINUTES: ${{ github.event.inputs.shift_length }}
          SERVICE_TIME_MINUTES: ${{ github.event.inputs.service_time }}
          DEPOT_LAT: ${{ github.event.inputs.depot_lat }}
          DEPOT_LNG: ${{ github.event.inputs.depot_lng }}
          SERVICE_TIME_FREE_BOX_THRESHOLD: ${{ github.event.inputs.service_free_box_threshold }}
          SERVICE_TIME_PER_EXTRA_BOX_MINUTES: ${{ github.event.inputs.service_per_extra_box_minutes }}
          TRAFFIC_TIME_MULTIPLIER: ${{ github.event.inputs.traffic_multiplier }}
          BREAK_MINUTES: ${{ github.event.inputs.break_minutes }}
          DEPOT_PREP_MINUTES: ${{ github.event.inputs.depot_prep_minutes }}
        run: python solve_routing.py
